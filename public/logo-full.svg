<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C79F"/>
      <stop offset="45%" stop-color="#C59B64"/>
      <stop offset="70%" stop-color="#DFCBAB"/>
      <stop offset="100%" stop-color="#9A6F3B"/>
    </linearGradient>
    <linearGradient id="fullRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF1EF"/>
      <stop offset="50%" stop-color="#F5DDD8"/>
      <stop offset="100%" stop-color="#EAC3BC"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1A1817" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Left Icon Crest (Scaled and centered at x=60, y=60, radius=48) -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Outer background disc -->
    <circle cx="100" cy="100" r="94" fill="#FFFDFD" stroke="url(#fullGoldGrad)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#fullGoldGrad)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
    <circle cx="100" cy="100" r="84" fill="url(#fullRoseGrad)" opacity="0.5"/>

    <!-- Left & Right Lash arcs -->
    <path d="M 40 105 C 40 65 65 38 95 34 C 80 46 66 68 64 96 C 62 120 74 142 90 156 C 60 150 40 132 40 105 Z" fill="url(#fullGoldGrad)"/>
    <path d="M 160 105 C 160 65 135 38 105 34 C 120 46 134 68 136 96 C 138 120 126 142 110 156 C 140 150 160 132 160 105 Z" fill="url(#fullGoldGrad)"/>
    
    <!-- Top Sparkle -->
    <path d="M 100 16 Q 100 22 105 22 Q 100 22 100 28 Q 100 22 95 22 Q 100 22 100 16 Z" fill="url(#fullGoldGrad)"/>

    <!-- Monogram L -->
    <path d="M 85 62 C 87 56 94 54 99 54 C 104 54 107 57 107 63 C 107 72 98 84 89 101 C 77 122 73 135 73 143 C 73 150 78 153 87 153 C 98 153 113 147 129 135 C 132 133 134 135 133 138 C 122 149 105 157 91 157 C 76 157 66 149 66 137 C 66 126 71 110 82 89 C 89 74 96 64 96 59 C 96 57 94 56 92 56 C 87 56 82 61 80 65 Z" fill="url(#fullGoldGrad)"/>
    <path d="M 82 108 C 96 104 116 104 128 113 C 134 118 136 124 133 129 C 130 134 124 134 119 130 C 112 124 102 121 90 123" fill="none" stroke="url(#fullGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(130, 0)">
    <!-- Primary Brand Name -->
    <text x="0" y="58" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="600" letter-spacing="3" fill="#1C1917" filter="url(#textShadow)">
      LAURA'S
    </text>
    
    <!-- Sub-brand / Category -->
    <text x="2" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="500" letter-spacing="7" fill="#C59B64">
      BEAUTY STUDIO
    </text>

    <!-- Fine Tagline Divider and Location -->
    <line x1="2" y1="98" x2="330" y2="98" stroke="url(#fullGoldGrad)" stroke-width="0.8" opacity="0.6"/>
    <text x="4" y="111" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#8C827A">
      LASHES • BODY SCULPTING • HEAD SPA • CARY, NC
    </text>
  </g>
</svg>
